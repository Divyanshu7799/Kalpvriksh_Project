[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "machineguard"
version = "0.1.0"
description = "Reusable vibration-based machine health monitoring pipeline"
requires-python = ">=3.10"

[tool.black]
line-length = 120
target-version = ["py310"]
extend-exclude = "/sandbox/"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["sandbox"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"